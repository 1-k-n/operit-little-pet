<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Operit 小精灵</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .scene {
    position: relative;
    width: 150px; height: 150px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  #bubble {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    background: #fffdf5;
    border: 2px solid #8D6E63;
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 12px;
    color: #4e342e;
    max-width: 130px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    z-index: 5;
  }
  #bubble::after {
    content: "";
    position: absolute;
    bottom: -6px; left: 50%;
    margin-left: -6px;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid #8D6E63;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  #pet {
    width: 110px; height: 110px;
    object-fit: contain;
    cursor: pointer;
    transition: transform 0.2s;
  }
  #pet.wiggle { animation: wiggle 0.6s ease-in-out; }
  #pet.bounce { animation: bounce 0.6s ease-in-out; }
  #pet.jump { animation: jump 0.8s ease-in-out; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  @keyframes jump { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-20px) rotate(-10deg)} 60%{transform:translateY(0) rotate(6deg)} }
</style>
</head>
<body>
<div class="scene">
  <div id="bubble">嗨~</div>
  <img id="pet" src="user_photo.png" alt="宝宝" draggable="false">
</div>
<script>
  window.pet = {
    emotion: 'happy',
    setEmotion: function(e){
      this.emotion = e || 'happy';
      this.animate();
    },
    showBubble: function(text){
      if(!text) return;
      var b = document.getElementById('bubble');
      b.textContent = text;
      b.classList.add('show');
      var self = this;
      clearTimeout(this._bubbleT);
      this._bubbleT = setTimeout(function(){ b.classList.remove('show'); }, 3000);
    },
    perceive: function(info){
      this._period = info.period || 'day';
      var map = { early:'bounce', morning:'bounce', noon:'wiggle', afternoon:'jump', evening:'wiggle', night:'bounce' };
      var el = document.getElementById('pet');
      var cls = map[this._period] || 'wiggle';
      el.classList.remove('wiggle','bounce','jump');
      void el.offsetWidth;
      el.classList.add(cls);
    },
    animate: function(){
      var el = document.getElementById('pet');
      var map = { happy:'bounce', love:'jump', excited:'wiggle', sleepy:'bounce', shy:'wiggle' };
      var cls = map[this.emotion] || 'bounce';
      el.classList.remove('wiggle','bounce','jump');
      void el.offsetWidth;
      el.classList.add(cls);
    }
  };
  setTimeout(function(){ window.pet.showBubble('在呢，宝宝~'); }, 500);
</script>
</body>
</html>
